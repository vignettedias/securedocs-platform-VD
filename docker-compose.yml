services:

  backend:
    build:
      context: ./backend

    container_name: securedocs-backend

    expose:
      - "3000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: securedocs-nginx

    ports:
      - "80:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    restart: unless-stopped